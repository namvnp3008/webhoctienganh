services:
  # 1. Frontend Web Application (Static Site on Render)
  - type: web
    name: lumina-english-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend API Service (NestJS + Prisma on Render)
  - type: web
    name: lumina-english-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: lumina-english-super-secret-jwt-key-2026
      - key: SUPABASE_URL
        value: https://flwqjklcqptcvgydzwpq.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsd3Fqa2xjcXB0Y3ZneWR6d3BxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTY1MjAsImV4cCI6MjEwNTg5MjUyMH0.Xnb5nc732Eo8ZTmoQGg5UTWiAGGbrM67HVfOQHgJGWI
